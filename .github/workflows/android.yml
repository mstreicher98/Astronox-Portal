name: Android-App

# Baut die Android-App (Trusted Web Activity für portal.astronox.dev) und legt sie als
# Release „android“ ab: astronox-portal.apk zum Installieren, .aab für Google Play.
#
# Einmalig unter Settings → Secrets and variables → Actions anlegen:
#   ANDROID_KEYSTORE            Inhalt von keystore-base64.txt (Signaturschlüssel, base64)
#   ANDROID_KEYSTORE_PASSWORD   Inhalt von passwort.txt
# Der Schlüssel muss immer derselbe bleiben – sonst lässt sich die App nicht aktualisieren.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  app:
    name: App bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # gradle-wrapper.jar wird ausgeführt – nur das offizielle von Gradle zulassen
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Signaturschlüssel
        id: key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE fehlt – App wird nicht gebaut (siehe Kopf dieser Datei)"
            echo "Noch keine Secrets ANDROID_KEYSTORE und ANDROID_KEYSTORE_PASSWORD – danach „Run workflow“." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/astronox.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/astronox.keystore" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Bauen
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk astronox-portal.apk
          cp android/app/build/outputs/bundle/release/app-release.aab astronox-portal.aab
          gh release delete android --yes --cleanup-tag || true
          gh release create android astronox-portal.apk astronox-portal.aab \
            --title "Android-App (Build ${{ github.run_number }})" \
            --notes "Astronox Portal für Android. Am Handy astronox-portal.apk öffnen und installieren." \
            --latest=false
          echo "APK -> https://github.com/${{ github.repository }}/releases/download/android/astronox-portal.apk" >> "$GITHUB_STEP_SUMMARY"
