name: Prüfen, bauen und ausrollen

# Ablauf bei jedem Push auf main:
#   1. Typprüfung und Tests
#   2. Docker-Image bauen und nach GitHub Container Registry (ghcr.io) schieben
#   3. Falls hinterlegt: Portainer-Webhook aufrufen, der den Stack mit dem neuen Image neu startet
#
# Für Schritt 3 unter Settings → Secrets and variables → Actions anlegen:
#   PORTAINER_WEBHOOK_URL   Webhook-Adresse aus Portainer (Stack bzw. Dienst → Webhook)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Typprüfung und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    name: Image bauen
    needs: pruefen
    # Bei Pull Requests nur prüfen, nicht veröffentlichen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR verlangt Kleinbuchstaben im Image-Namen
      - name: Image-Name bestimmen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 zusätzlich, damit das Image auch auf ARM-Servern und Raspberry Pi läuft
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis
        run: echo "Image -> ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"

  ausrollen:
    name: Portainer aktualisieren
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Secrets lassen sich in Bedingungen nicht direkt abfragen
      HAT_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
    steps:
      - name: Kein Webhook hinterlegt
        if: env.HAT_WEBHOOK != 'true'
        run: echo "Kein PORTAINER_WEBHOOK_URL hinterlegt – Image ist gebaut. In Portainer den Stack mit „Re-pull image and redeploy“ aktualisieren." >> "$GITHUB_STEP_SUMMARY"

      - name: Webhook aufrufen
        if: env.HAT_WEBHOOK == 'true'
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
